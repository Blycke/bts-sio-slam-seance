name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    name: Run tests & quality
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pdo_mysql, sqlite, dom
          ini-values: post_max_size=256M, memory_limit=2G
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: |
          cp .env.example .env
          php -r "file_exists('.env.testing') || copy('.env.example', '.env.testing');"
          php artisan key:generate

      - name: Create sqlite databases
        run: |
          touch database/database.sqlite
          touch database/testing.sqlite

      - name: Migrate & seed
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: Run Pint
        run: vendor/bin/pint --ansi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectKey: blycke_bts-sio-slam-seance
          organization: blycke
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
